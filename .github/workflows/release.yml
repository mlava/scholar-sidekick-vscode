# Publish to Open VSX via TRUSTED PUBLISHING (OIDC) — no token secret.
#
# How it works: the job requests a GitHub OIDC ID token (`id-token: write`),
# `ovsx publish --trusted-publishing` posts it to open-vsx.org, which matches
# the token's repository / workflow-file claims against the trusted-publisher
# registration on the `scholar-sidekick` namespace and returns a short-lived
# token scoped to this one extension. Nothing is stored.
#
# One-time setup on open-vsx.org (Settings → Trusted Publishers):
#   namespace: scholar-sidekick · provider: GitHub Actions
#   owner: mlava · repository: scholar-sidekick-vscode · workflow: release.yml
#   environment: (leave empty — this job sets none)
# Registrations cannot be edited: delete and recreate to change them. The
# `publisher` field in package.json must match the namespace's casing exactly.
#
# Trigger: publishing a GitHub Release (tag vX.Y.Z) — the same convention as
# scholar-sidekick-mcp and -python. The guard below refuses a tag that does
# not match package.json, so a stale manifest cannot ship under a new tag.
# `workflow_dispatch` is a manual re-run for a Release whose publish failed.
#
# The VS Code Marketplace publishes the same way: `vsce publish --oidc`
# (vsce ≥ 4, Node ≥ 22) exchanges the GitHub OIDC token for a short-lived
# Marketplace credential, with NO PAT fallback. One-time setup on
# marketplace.visualstudio.com → Manage publishers → scholar-sidekick → the
# extension's "Trusted publishing" policy: repository mlava/scholar-sidekick-vscode,
# workflow release.yml. The .vsix built here is also attached to the Release.
#
# `workflow_dispatch` re-runs a failed publish for the version in package.json;
# untick a target that already has that version (a registry refuses a
# duplicate version, which would fail the whole job).

name: Publish (Open VSX + VS Code Marketplace)

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      openvsx:
        description: "Publish to Open VSX"
        type: boolean
        default: true
      marketplace:
        description: "Publish to the VS Code Marketplace"
        type: boolean
        default: true

permissions:
  # `contents: write` only so the last step can attach the .vsix to the Release;
  # the Open VSX publish needs nothing but `id-token`.
  contents: write
  id-token: write

jobs:
  publish:
    name: Build, verify, publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22 # vsce 4 (--oidc) requires Node ≥ 22
          cache: npm
      - run: npm ci

      - name: Release tag must match package.json
        if: github.event_name == 'release'
        run: |
          PKG="v$(node -p "require('./package.json').version")"
          if [ "${GITHUB_REF_NAME}" != "$PKG" ]; then
            echo "::error::release tag ${GITHUB_REF_NAME} != package.json ${PKG}"; exit 1
          fi

      - run: npm run lint
      - run: npm run compile
      - run: npm test

      - name: Package .vsix
        run: npx vsce package --out scholar-sidekick-vscode.vsix

      - name: Publish to Open VSX (trusted publishing)
        if: github.event_name == 'release' || inputs.openvsx
        run: npx ovsx publish --trusted-publishing --packagePath scholar-sidekick-vscode.vsix

      - name: Publish to the VS Code Marketplace (OIDC trusted publishing)
        if: github.event_name == 'release' || inputs.marketplace
        run: npx vsce publish --oidc --packagePath scholar-sidekick-vscode.vsix

      - name: Attach the .vsix to the Release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${GITHUB_REF_NAME}" scholar-sidekick-vscode.vsix --clobber
